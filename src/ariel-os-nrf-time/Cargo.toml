[package]
name = "ariel-os-nrf-time"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
embassy-nrf = { workspace = true, default-features = false, features = [] }

[target.'cfg(any(context = "nrf54lm20-app", context = "nrf54l15-app"))'.dependencies]
embassy-nrf = { workspace = true, default-features = false, features = [
  "time-driver-grtc",
] }

[target.'cfg(not(any(context = "nrf54lm20-app", context = "nrf54l15-app")))'.dependencies]
embassy-nrf = { workspace = true, default-features = false, features = [
  "time-driver-rtc1",
] }

[lints]
workspace = true
